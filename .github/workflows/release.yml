name: Release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}

# LINUX_*: used by the riscv64 cross-build. Keep in sync with the
# machine-guest-tools submodule (its Makefile LINUX_HEADERS_* variables).
# CARTESI_MACHINE_VERSION: emulator distribution cm's addon links against.
env:
    LINUX_IMAGE_VERSION: v0.20.0
    LINUX_VERSION: 6.5.13-ctsi-1
    CARTESI_MACHINE_VERSION: 0.21.0-test7

jobs:
    # Build native prebuilds only when the owning package is actually about to
    # be published — i.e. its package.json version is not yet on npm. This is
    # the only reason the prebuild matrices need to run, and it's correct in
    # every case: false on Version-PR runs (not bumped yet) and on already-
    # published versions. (Counting .changeset/*.md does NOT work: in changesets
    # pre mode the .md files persist after `changeset version`, so they can't
    # signal whether this push publishes.)
    detect:
        name: Detect native package publish
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.check.outputs.publish }}
            cm-publish: ${{ steps.check-cm.outputs.publish }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - id: check
              run: |
                  LOCAL=$(node -p "require('./packages/bindings/cmio/package.json').version")
                  if npm view "@deroll/cmio@${LOCAL}" version >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "@deroll/cmio@${LOCAL} already on npm -> skip prebuilds."
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "@deroll/cmio@${LOCAL} not yet published -> build prebuilds."
                  fi
            - id: check-cm
              run: |
                  LOCAL=$(node -p "require('./packages/bindings/cm/package.json').version")
                  if npm view "@deroll/cm@${LOCAL}" version >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "@deroll/cm@${LOCAL} already on npm -> skip platform packages."
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "@deroll/cm@${LOCAL} not yet published -> build platform packages."
                  fi

    # @deroll/cmio native prebuilds, built from the exact commit being published
    # (linux-x64/arm64, darwin-x64/arm64). Each job uploads a prebuilds-<os>
    # artifact the release job collects. riscv64 validation lives in ci.yml.
    prebuild:
        name: cmio prebuild ${{ matrix.os }}
        needs: detect
        if: needs.detect.outputs.publish == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest # linux-x64
                    - os: ubuntu-24.04-arm # linux-arm64
                    - os: macos-15-intel # darwin-x64
                    - os: macos-latest # darwin-arm64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            # cm's addon links against the installed emulator during the root
            # `bun install`
            - name: Install cartesi-machine emulator (linux)
              if: runner.os == 'Linux'
              run: |
                  wget -O /tmp/machine-emulator.deb "https://github.com/cartesi/machine-emulator/releases/download/v${CARTESI_MACHINE_VERSION}/machine-emulator_$(dpkg --print-architecture).deb"
                  sudo apt-get update && sudo apt-get install -y /tmp/machine-emulator.deb
            - name: Install cartesi-machine emulator (macos)
              if: runner.os == 'macOS'
              # No homebrew formula exists yet for the 0.21 series (the binding
              # currently targets the v0.21.0-test7 pre-release). This step
              # fails on purpose until cartesi/homebrew-tap ships one — update
              # the branch below (or simplify to a plain
              # `brew install cartesi/tap/cartesi-machine-emulator`) when it
              # lands.
              run: |
                  brew tap cartesi/tap
                  git -C "$(brew --repository cartesi/tap)" fetch origin feature/emulator-0.21.0
                  git -C "$(brew --repository cartesi/tap)" checkout FETCH_HEAD
                  brew install --build-from-source cartesi/tap/cartesi-machine-emulator
            # bun (not npm) — the workspace uses bun's `catalog:` protocol, which
            # npm can't resolve. Install at the repo root, then prebuild in cmio.
            - run: bun install --frozen-lockfile
            - name: Build prebuild
              working-directory: packages/bindings/cmio
              run: bun run prebuild
            - uses: actions/upload-artifact@v7
              with:
                  name: prebuilds-${{ matrix.os }}
                  if-no-files-found: error
                  path: packages/bindings/cmio/prebuilds/

    prebuild-riscv64:
        name: cmio prebuild linux-riscv64 (cross)
        needs: detect
        if: needs.detect.outputs.publish == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            # cm's addon links against the installed emulator during the root
            # `bun install`
            - name: Install cartesi-machine emulator
              run: |
                  wget -O /tmp/machine-emulator.deb "https://github.com/cartesi/machine-emulator/releases/download/v${CARTESI_MACHINE_VERSION}/machine-emulator_$(dpkg --print-architecture).deb"
                  sudo apt-get update && sudo apt-get install -y /tmp/machine-emulator.deb
            - run: bun install --frozen-lockfile
            - name: Install riscv64 cross toolchain and Cartesi Linux headers
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
                  wget -O /tmp/linux-libc-dev.deb \
                    "https://github.com/cartesi/machine-linux-image/releases/download/${LINUX_IMAGE_VERSION}/linux-libc-dev-riscv64-cross-${LINUX_VERSION}-${LINUX_IMAGE_VERSION}.deb"
                  sudo apt-get install -y --allow-downgrades /tmp/linux-libc-dev.deb
            - name: Cross-build libcmt (real IO driver)
              working-directory: packages/bindings/cmio
              run: make -C deps/machine-guest-tools/sys-utils/libcmt libcmt TOOLCHAIN_PREFIX=riscv64-linux-gnu-
            - name: Prebuild riscv64 addon
              working-directory: packages/bindings/cmio
              env:
                  CC: riscv64-linux-gnu-gcc
                  CXX: riscv64-linux-gnu-g++
                  LIBCMT_LIB: ${{ github.workspace }}/packages/bindings/cmio/deps/machine-guest-tools/sys-utils/libcmt/build/riscv64/libcmt.a
              run: bun run prebuild -- --strip-bin riscv64-linux-gnu-strip --platform linux --arch riscv64
            - uses: actions/upload-artifact@v7
              with:
                  name: prebuilds-riscv64
                  if-no-files-found: error
                  path: packages/bindings/cmio/prebuilds/

    # @deroll/cm per-platform prebuilt packages (@deroll/cm-<platform>-<arch>),
    # assembled from the exact commit being published. Each job builds the
    # N-API addon against the installed emulator's static libcartesi, bundles
    # the installation's cartesi-jsonrpc-machine server, and uploads the whole
    # npm/ tree (scaffolds are version-stamped identically by
    # package-platform, so the artifacts merge cleanly).
    cm-platform:
        name: cm platform package ${{ matrix.os }}
        needs: detect
        if: needs.detect.outputs.cm-publish == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest # linux-x64
                    - os: ubuntu-24.04-arm # linux-arm64
                    - os: macos-15-intel # darwin-x64
                    - os: macos-latest # darwin-arm64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            # the emulator distribution the addon links against; its
            # cartesi-jsonrpc-machine server is bundled into the platform package
            - name: Install cartesi-machine emulator (linux)
              if: runner.os == 'Linux'
              run: |
                  wget -O /tmp/machine-emulator.deb "https://github.com/cartesi/machine-emulator/releases/download/v${CARTESI_MACHINE_VERSION}/machine-emulator_$(dpkg --print-architecture).deb"
                  sudo apt-get update && sudo apt-get install -y /tmp/machine-emulator.deb
            - name: Install cartesi-machine emulator (macos)
              if: runner.os == 'macOS'
              # No homebrew formula exists yet for the 0.21 series (the binding
              # currently targets the v0.21.0-test7 pre-release). This step
              # fails on purpose until cartesi/homebrew-tap ships one — update
              # the branch below (or simplify to a plain
              # `brew install cartesi/tap/cartesi-machine-emulator`) when it
              # lands.
              run: |
                  brew tap cartesi/tap
                  git -C "$(brew --repository cartesi/tap)" fetch origin feature/emulator-0.21.0
                  git -C "$(brew --repository cartesi/tap)" checkout FETCH_HEAD
                  brew install --build-from-source cartesi/tap/cartesi-machine-emulator
            # bun (not npm) — the workspace uses bun's `catalog:` protocol, which
            # npm can't resolve. The cm install script compiles the addon here.
            - run: bun install --frozen-lockfile
            - name: Assemble platform package
              working-directory: packages/bindings/cm
              run: bun run package:platform
            - uses: actions/upload-artifact@v7
              with:
                  name: cm-platform-${{ matrix.os }}
                  if-no-files-found: error
                  path: packages/bindings/cm/npm/

    release:
        name: Release
        needs: [detect, prebuild, prebuild-riscv64, cm-platform]
        # Run when creating the Version PR (publish=false, prebuilds skipped), or
        # when publishing AND every prebuild succeeded. Never publish a native
        # package without its prebuilds: a prebuild failure blocks the release
        # (re-runnable).
        if: >-
            always() && needs.detect.result == 'success' &&
            (needs.detect.outputs.publish == 'false' ||
             (needs.prebuild.result == 'success' && needs.prebuild-riscv64.result == 'success')) &&
            (needs.detect.outputs.cm-publish == 'false' ||
             needs.cm-platform.result == 'success')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  # cmio's native addon compiles from the machine-guest-tools
                  # submodule (deps/machine-guest-tools) during `bun install`.
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing (OIDC) requires npm >= 11.5.1; node 24 bundles
            # npm 10. `changeset publish` shells out to this npm. Pinned to 11:
            # the npm@12.0.0 tarball ships libnpmpublish without a resolvable
            # sigstore dependency, so provenance publishing fails with
            # MODULE_NOT_FOUND "Cannot find module 'sigstore'".
            - name: Update npm for trusted publishing
              run: npm install -g npm@11

            # cm's addon links against the installed emulator during `bun install`
            - name: Install cartesi-machine emulator
              run: |
                  wget -O /tmp/machine-emulator.deb "https://github.com/cartesi/machine-emulator/releases/download/v${CARTESI_MACHINE_VERSION}/machine-emulator_$(dpkg --print-architecture).deb"
                  sudo apt-get update && sudo apt-get install -y /tmp/machine-emulator.deb

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            # Collect all platform prebuilds into the cmio package so
            # `changeset publish` packs @deroll/cmio with them instead of forcing
            # consumers to compile from source. Only present when publishing.
            - name: Collect cmio prebuilds
              if: needs.detect.outputs.publish == 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: prebuilds-*
                  merge-multiple: true
                  path: packages/bindings/cmio/prebuilds

            # Collect the assembled @deroll/cm-<platform>-<arch> packages so the
            # release script can publish them right before @deroll/cm itself.
            - name: Collect cm platform packages
              if: needs.detect.outputs.cm-publish == 'true'
              uses: actions/download-artifact@v8
              with:
                  pattern: cm-platform-*
                  merge-multiple: true
                  path: packages/bindings/cm/npm

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1
              with:
                  # `release` builds the packages, resolves workspace:/catalog:
                  # protocols to concrete versions (npm publish, which changeset
                  # publish shells out to, does not rewrite them), and calls
                  # `changeset publish`
                  publish: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
