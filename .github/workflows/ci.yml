name: CI
on:
    pull_request:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Lint, build, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  # cmio's native addon (cmt.node) compiles from the
                  # machine-guest-tools submodule (deps/machine-guest-tools)
                  # during `bun install`, so it must be checked out.
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            # ubuntu-latest already ships gcc/g++/make/python3, which node-gyp
            # needs to compile cmio's addon on install.
            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test
