name: CI
on:
    pull_request:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Lint, build, test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  # genext2fs's native addon compiles from the genext2fs and
                  # libarchive submodules (deps/) during `bun install`, so they
                  # must be checked out.
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            # ubuntu-latest already ships gcc/g++/make/python3, which node-gyp
            # needs to compile the genext2fs addon on install.
            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build

            - name: Test
              run: bun run test
