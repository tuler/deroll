name: Release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
    # Decide whether this push publishes. changesets/action publishes only when
    # there are no pending changesets (i.e. the "Version Packages" PR was just
    # merged); otherwise it creates/updates that PR. We mirror that here so the
    # expensive prebuild matrix runs only on the publishing push, not on every
    # changeset merge.
    detect:
        name: Detect publish
        runs-on: ubuntu-latest
        outputs:
            publish: ${{ steps.check.outputs.publish }}
        steps:
            - uses: actions/checkout@v6
            - id: check
              run: |
                  shopt -s nullglob
                  pending=0
                  for f in .changeset/*.md; do
                      [ "$(basename "$f")" = "README.md" ] || pending=$((pending + 1))
                  done
                  if [ "$pending" -eq 0 ]; then
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "No pending changesets -> this run publishes."
                  else
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "$pending pending changeset(s) -> this run creates/updates the Version PR."
                  fi

    # Build @deroll/cmio's native prebuilds for every supported platform, in the
    # SAME run as the publish, so they're built from the exact release commit and
    # uploaded as the `prebuilds` artifact for the release job to consume.
    prebuilds:
        name: cmio prebuilds
        needs: detect
        if: needs.detect.outputs.publish == 'true'
        uses: ./.github/workflows/cmio-prebuild.yml

    release:
        name: Release
        needs: [detect, prebuilds]
        # Run when creating the Version PR (publish=false, prebuilds skipped), or
        # when publishing AND the prebuilds succeeded. Never publish cmio without
        # its prebuilds: a prebuild failure blocks the release (re-runnable).
        if: >-
            always() && needs.detect.result == 'success' &&
            (needs.detect.outputs.publish == 'false' || needs.prebuilds.result == 'success')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6
              with:
                  # cmio's native addon compiles from the machine-guest-tools
                  # submodule (deps/machine-guest-tools) during `bun install`.
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            # Same-run artifact from the prebuilds job; only present when
            # publishing. Lands in the cmio package so `changeset publish` packs
            # @deroll/cmio with multi-platform prebuilds instead of forcing
            # consumers to compile from source.
            - name: Download cmio prebuilds
              if: needs.detect.outputs.publish == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: prebuilds
                  path: packages/bindings/cmio/prebuilds

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@v1
              with:
                  # `release` builds the packages and calls `changeset publish`
                  publish: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
