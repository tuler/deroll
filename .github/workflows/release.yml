name: Release
on:
    push:
        branches:
            - main
            - release/*
            - prerelease/*
permissions:
    actions: write
    contents: write
    id-token: write
    pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    # Build native prebuilds only when the owning package is actually about to
    # be published — i.e. its package.json version is not yet on npm. This is
    # the only reason the prebuild matrices need to run, and it's correct in
    # every case: false on Version-PR runs (not bumped yet) and on already-
    # published versions. (Counting .changeset/*.md is not a reliable signal of
    # whether this push publishes, so don't go back to it.)
    detect:
        name: Detect native package publish
        runs-on: ubuntu-latest
        outputs:
            genext2fs-publish: ${{ steps.check-genext2fs.outputs.publish }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - id: check-genext2fs
              run: |
                  LOCAL=$(node -p "require('./packages/bindings/genext2fs/package.json').version")
                  if npm view "@deroll/genext2fs@${LOCAL}" version >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "@deroll/genext2fs@${LOCAL} already on npm -> skip prebuilds."
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "@deroll/genext2fs@${LOCAL} not yet published -> build prebuilds."
                  fi

    # @deroll/genext2fs native prebuilds. The addon links against nothing but
    # libc (xgenext2fs and the tar half of libarchive are compiled straight from
    # the submodules), so these jobs need no system packages, and a consumer
    # without a prebuild can always fall back to a source build.
    genext2fs-prebuild:
        name: genext2fs prebuild ${{ matrix.os }}
        needs: detect
        if: needs.detect.outputs.genext2fs-publish == 'true'
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest # linux-x64
                    - os: ubuntu-24.04-arm # linux-arm64
                    - os: macos-15-intel # darwin-x64
                    - os: macos-latest # darwin-arm64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # deps/genext2fs and deps/libarchive are compiled into the addon
                  submodules: recursive
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - name: Build prebuild
              working-directory: packages/bindings/genext2fs
              run: bun run prebuild:native
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: genext2fs-prebuilds-${{ matrix.os }}
                  if-no-files-found: error
                  path: packages/bindings/genext2fs/prebuilds/

    release:
        name: Release
        needs: [detect, genext2fs-prebuild]
        # Run when creating the Version PR (publish=false, prebuilds skipped), or
        # when publishing AND every prebuild succeeded. Never publish a native
        # package without its prebuilds: a prebuild failure blocks the release
        # (re-runnable).
        if: >-
            always() && needs.detect.result == 'success' &&
            (needs.detect.outputs.genext2fs-publish == 'false' ||
             needs.genext2fs-prebuild.result == 'success')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # genext2fs's native addon compiles from the genext2fs and
                  # libarchive submodules (deps/) during `bun install`.
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing (OIDC) requires npm >= 11.5.1; node 24 bundles
            # npm 10. `changeset publish` shells out to this npm. Pinned to 11:
            # the npm@12.0.0 tarball ships libnpmpublish without a resolvable
            # sigstore dependency, so provenance publishing fails with
            # MODULE_NOT_FOUND "Cannot find module 'sigstore'".
            - name: Update npm for trusted publishing
              run: npm install -g npm@11

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            # Pack the prebuilds into @deroll/genext2fs so installing does not
            # have to compile the addon.
            - name: Collect genext2fs prebuilds
              if: needs.detect.outputs.genext2fs-publish == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: genext2fs-prebuilds-*
                  merge-multiple: true
                  path: packages/bindings/genext2fs/prebuilds

            - name: Create Release Pull Request or Publish to npm
              id: changesets
              uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
              with:
                  # `release` builds the packages, resolves workspace:/catalog:
                  # protocols to concrete versions (npm publish, which changeset
                  # publish shells out to, does not rewrite them), and calls
                  # `changeset publish`
                  publish-script: bun run release
